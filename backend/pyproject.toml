[project]
name = "mazal-engine"
version = "0.2.0rc3"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "statsmodels>=0.14,<1",
  "pymc>=5.20,<7",
  "arviz>=0.21,<2",
  "cvxpy>=1.6,<2",
  "QuantLib>=1.37,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2.13.1,<3", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
