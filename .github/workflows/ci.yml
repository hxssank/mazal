name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mazal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install frozen dependencies
        run: npm run setup
      - name: Validate source, models, and builds
        run: npm run check:release
      - name: Verify native authentication and document helpers
        if: runner.os == 'macOS'
        run: npm run mac:check
      - name: Install desktop test browser
        run: npx playwright install --with-deps chromium
      - name: Verify desktop workflows
        run: npx playwright test
      - name: Install Mac app test browser
        if: runner.os == 'macOS'
        run: npx playwright install webkit
      - name: Verify Mac app browser workflows
        if: runner.os == 'macOS'
        run: npx playwright test
        env:
          MAZAL_BROWSER_ENGINE: webkit
      - name: Verify installation from the source release
        run: npm run release:verify
      - name: Verify packaged Mac runtime with isolated records
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: npm run mac:build -- --skip-build
